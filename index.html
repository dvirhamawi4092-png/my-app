<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רשימת משימות</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>רשימת משימות</h1>

    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" placeholder="מה צריך לעשות?" autocomplete="off" required>
      <button type="submit">הוסף</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">הכל</button>
      <button class="filter" data-filter="active">פעילות</button>
      <button class="filter" data-filter="done">הושלמו</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="counter"></span>
      <button id="clear-done" class="link-btn">נקה משימות שהושלמו</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
